services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env}
      POKEMON_LOADER_PASSWORD: ${POKEMON_LOADER_PASSWORD:?set POKEMON_LOADER_PASSWORD in .env}
      POKEMON_API_PASSWORD: ${POKEMON_API_PASSWORD:?set POKEMON_API_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "psql -U postgres -d pokemon -tAc 'SELECT 1'"]
      interval: 5s
      retries: 20

  data-init:
    build:
      context: .
      dockerfile: extraction/Dockerfile
    environment:
      FORCE_EXTRACT: ${FORCE_EXTRACT:-false}
    volumes:
      - ./data:/data

  airflow:
    image: apache/airflow:3.1.1
    command: standalone
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      # Local development only: every visitor is an admin, no login screen.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/pipeline/dags
      AIRFLOW_CONN_POKEMON_DB: postgresql://pokemon_loader:${POKEMON_LOADER_PASSWORD}@postgres:5432/pokemon
      PYTHONPATH: /opt/airflow/pipeline
      PYTHONDONTWRITEBYTECODE: "1"
      POKEMON_DATA_DIR: /opt/airflow/data
    volumes:
      - ./data:/opt/airflow/data:ro
      - ./pipeline:/opt/airflow/pipeline:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      data-init:
        condition: service_completed_successfully

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://pokemon_api:${POKEMON_API_PASSWORD}@postgres:5432/pokemon
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 10

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: http://localhost:8000
    environment:
      API_ORIGIN: http://localhost:8000
    ports:
      - "127.0.0.1:5173:80"

volumes:
  postgres-data:

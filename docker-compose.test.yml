name: desafio-falabella-tests

x-python-env: &python-env
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_ROOT_USER_ACTION: ignore
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

x-python-tests: &python-tests
  image: python:3.12.16-slim
  working_dir: /repo
  environment: *python-env

services:
  test-db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 20

  extraction-tests:
    <<: *python-tests
    volumes:
      - ./:/repo:ro
    command: sh -c "pip install -q -r extraction/requirements-dev.txt && python -m pytest -p no:cacheprovider extraction/tests"

  pipeline-tests:
    <<: *python-tests
    volumes:
      - ./pipeline:/repo:ro
    environment:
      <<: *python-env
      TEST_DATABASE_URL: postgresql://postgres@test-db:5432/postgres
    depends_on:
      test-db:
        condition: service_healthy
    command: sh -c "pip install -q -r requirements-dev.txt && python -m pytest -p no:cacheprovider tests"

  api-tests:
    <<: *python-tests
    volumes:
      - ./api:/repo:ro
    command: sh -c "pip install -q -r requirements-dev.txt && python -m pytest -p no:cacheprovider tests"

  web-tests:
    image: node:22.23.4-alpine
    working_dir: /work
    volumes:
      - ./web:/repo:ro
    command: >-
      sh -c "tar -C /repo --exclude=./node_modules --exclude=./dist -cf - . | tar -xf - -C /work
      && npm ci --no-audit --no-fund && npx tsc -b && npm run lint && npm test"
